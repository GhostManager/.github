name: Fetch the Latest Insights Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - main

env:
    GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Update JSON data
        run: python main.py -t ${{ env.GH_TOKEN }}

      - name: Commit and push changes
        run: |-
          git config --global user.email "github-action-bot@specterops.io"
          git config --global user.name "GitHub Action Bot"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Updated insights data"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push after 3 attempts"
              exit 1
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || {
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
              fi
              echo "Failed to rebase onto origin/${GITHUB_REF_NAME}"
              exit 1
            }
            sleep $((attempt * 5))
          done
